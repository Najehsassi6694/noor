name: Android — créer la clé de signature (une seule fois)
# À lancer UNE fois, après avoir créé le secret ANDROID_KEYSTORE_PASSWORD.
# Télécharge ensuite l'artefact, garde le fichier .keystore en lieu sûr (sans lui, plus de mise à jour possible
# hors « Play App Signing »), copie le contenu de keystore.base64.txt dans le secret ANDROID_KEYSTORE_BASE64,
# puis SUPPRIME l'artefact dans GitHub.
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Générer la clé
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$PASS" || { echo "Créez d'abord le secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          mkdir out
          keytool -genkeypair -v -keystore out/noor-upload.keystore -alias noor -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=NOOR, O=NOOR"
          base64 -w0 out/noor-upload.keystore > out/keystore.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NOOR-cle-android-A-SUPPRIMER-APRES-TELECHARGEMENT
          path: out/
          retention-days: 1
